<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Maternal Health System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>


    <!-- Contact Section -->
    <div class="container">
        <h2>Contact Us</h2>
        <p>If you have any questions, feel free to reach out to us.</p>

        <!-- Contact Details -->
        <div class="contact-details">
            <p><strong>📍 Address:</strong> Medina Hospital, Garissa County</p>
            <p><strong>📞 Phone:</strong> +254 712 345 678</p>
            <p><strong>📧 Email:</strong> support@medinahospital.com</p>
        </div>

        <!-- Contact Form -->
        <h3>Send Us a Message</h3>
        <form id="contact-form">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <textarea id="message" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>

        <!-- Google Maps (Optional) -->
        <h3>Find Us Here</h3>
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15955.487846407564!2d39.6589281!3d-0.4532298!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x123456789abcdef!2sMedina%20Hospital%20Garissa!5e0!3m2!1sen!2ske!4v1234567890"
            width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy">
        </iframe>
    </div>

    <script src="js/script.js"></script>

</body>
</html>
